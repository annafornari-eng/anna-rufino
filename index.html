<!<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anna Rufino | Blog</title>
    
    <!-- Fontes Elegantes e Modernas -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Variáveis da Paleta Roxa Editorial */
        :root {
            --roxo-profundo: #160D26;
            --roxo-escuro: #2A1B4E;
            --roxo-vibrante: #6D44C5;
            --roxo-medio: #8B63E6;
            --lavanda: #E8E1F7;
            --fundo-claro: #F9F8FC;
            --branco: #FFFFFF;
            --texto-principal: #231C30;
            --texto-suave: #625975;
            
            --fonte-titulo: 'Cinzel', serif;
            --fonte-corpo: 'Plus Jakarta Sans', sans-serif;
            --transicao: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Reset Global */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--fonte-corpo);
            background-color: var(--fundo-claro);
            color: var(--texto-principal);
            line-height: 1.7;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: var(--transicao);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Navbar Sofisticada */
        header {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(139, 99, 230, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .logo {
            font-family: var(--fonte-titulo);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--roxo-escuro);
        }

        .logo span {
            color: var(--roxo-vibrante);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 32px;
        }

        nav ul a {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--texto-suave);
            letter-spacing: 0.5px;
        }

        nav ul a:hover, nav ul a.active {
            color: var(--roxo-vibrante);
        }

        /* Seção Hero / Banner de Apresentação */
        .hero-section {
            background: linear-gradient(145deg, var(--roxo-profundo) 0%, var(--roxo-escuro) 100%);
            color: var(--branco);
            padding: 100px 0 120px 0;
            text-align: center;
            position: relative;
            border-radius: 0 0 60px 60px;
            margin-bottom: 60px;
            box-shadow: 0 20px 40px rgba(22, 13, 38, 0.15);
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 80% 20%, rgba(139, 99, 230, 0.25) 0%, transparent 50%);
            pointer-events: none;
        }

        .hero-content {
            max-width: 750px;
            margin: 0 auto;
        }

        .hero-tag {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--roxo-medio);
            margin-bottom: 16px;
            display: inline-block;
            font-weight: 600;
        }

        .hero-section h1 {
            font-family: var(--fonte-titulo);
            font-size: 3.2rem;
            font-weight: 500;
            line-height: 1.2;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        .hero-section p {
            font-size: 1.15rem;
            color: var(--lavanda);
            font-weight: 300;
            opacity: 0.9;
        }

        /* Layout em Grid (Artigos + Lateral) */
        .main-layout {
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            gap: 48px;
            margin-bottom: 80px;
        }

        /* Feed de Posts */
        .blog-feed {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        /* Post Card Estilo Editorial */
        .card-post {
            background: var(--branco);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(42, 27, 78, 0.02);
            border: 1px solid rgba(139, 99, 230, 0.05);
            display: flex;
            flex-direction: column;
            transition: var(--transicao);
        }

        .card-post:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(42, 27, 78, 0.08);
            border-color: rgba(139, 99, 230, 0.15);
        }

        /* Imagem Provisória Elegante */
        .post-cover {
            height: 280px;
            background: linear-gradient(135deg, var(--roxo-escuro), var(--roxo-medio));
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .post-cover::after {
            content: '✦';
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.2);
        }

        .post-body {
            padding: 32px;
        }

        .post-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--roxo-vibrante);
            font-weight: 700;
            margin-bottom: 12px;
            display: inline-block;
        }

        .post-title {
            font-family: var(--fonte-titulo);
            font-size: 1.6rem;
            color: var(--roxo-profundo);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .post-title:hover {
            color: var(--roxo-vibrante);
        }

        .post-text {
            color: var(--texto-suave);
            font-size: 1rem;
            margin-bottom: 24px;
        }

        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid rgba(139, 99, 230, 0.08);
            font-size: 0.85rem;
            color: var(--texto-suave);
        }

        /* Barra Lateral (Sidebar) */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .sidebar-widget {
            background: var(--branco);
            padding: 32px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(42, 27, 78, 0.02);
            border: 1px solid rgba(139, 99, 230, 0.05);
        }

        .widget-title {
            font-family: var(--fonte-titulo);
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: var(--roxo-profundo);
            margin-bottom: 20px;
            position: relative;
            padding-bottom: 12px;
        }

        .widget-title::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 35px; height: 2px;
            background-color: var(--roxo-vibrante);
        }

        /* Widget Perfil */
        .profile-box {
            text-align: center;
        }

        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--roxo-medio), var(--roxo-profundo));
            margin: 0 auto 20px auto;
            border: 4px solid var(--lavanda);
        }

        .profile-box p {
            color: var(--texto-suave);
            font-size: 0.95rem;
        }

        /* Widget Newsletter Form */
        .newsletter-input {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--fundo-claro);
            border: 1px solid rgba(139, 99, 230, 0.15);
            border-radius: 12px;
            font-family: var(--fonte-corpo);
            font-size: 0.95rem;
            color: var(--texto-principal);
            outline: none;
            margin-bottom: 12px;
            transition: var(--transicao);
        }

        .newsletter-input:focus {
            border-color: var(--roxo-vibrante);
            background-color: var(--branco);
            box-shadow: 0 0 0 4px rgba(109, 68, 197, 0.1);
        }

        .newsletter-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--roxo-vibrante);
            color: var(--branco);
            border: none;
            border-radius: 12px;
            font-family: var(--fonte-corpo);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transicao);
        }

        .newsletter-btn:hover {
            background-color: var(--roxo-escuro);
            transform: translateY(-2px);
        }

        /* Rodapé Minimalista */
        footer {
            background-color: var(--roxo-profundo);
            color: var(--lavanda);
            padding: 40px 0;
            text-align: center;
            font-size: 0.9rem;
            border-top: 4px solid var(--roxo-vibrante);
        }

        footer strong {
            color: var(--branco);
            font-family: var(--fonte-titulo);
            letter-spacing: 1px;
        }
